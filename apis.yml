name: Atomic Alchemy
description: >-
  Atomic Alchemy is a deep-tech nuclear company that designs, builds, and operates
  non-power research reactors to manufacture high-value radioisotopes for medical,
  research, industrial, defense, and space applications. Its proprietary Versatile
  Isotope Production Reactor (VIPR) technology and Meitner-1 facility are intended to
  create a scalable, onshore supply of isotopes such as molybdenum-99 (for cancer
  diagnostics and treatment), strontium-90, and americium-241, reducing US dependence
  on foreign isotope production. Founded by CEO Thomas Eiden and headquartered in Idaho
  Falls, Idaho, the company was backed by DCVC and Y Combinator and was acquired by
  advanced-fission company Oklo (NYSE: OKLO) in early 2025, operating as a wholly owned
  subsidiary. In 2026 the US Nuclear Regulatory Commission granted Atomic Alchemy a
  materials license to handle, process, and distribute isotopes. As a physical
  radioisotope manufacturer, Atomic Alchemy publishes no public API, developer portal,
  or machine-readable specification; this profile captures company identity only.
